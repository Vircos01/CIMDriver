name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/mkdocs-pages.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: cp -R android/release docs/release
      - run: |
          mkdir -p docs/ios
          cp -R ios/docs/* docs/ios/ || true
          sed -i -e '/<div align="center">/d' ios/README.md
          sed -i -e '/<\/div>/d' ios/README.md
          sed -i -e 's|src="docs/screenshots/|src="../ios/screenshots/|g' ios/README.md
          sed -i -e 's/> \[\!IMPORTANT\]/> **BELANGRIJK:**/g' ios/README.md
          cp ios/README.md docs/ios/README.md
          sed -i -e '/## 📸 Screenshots/,/^---$/d' docs/ios/README.md
          sed -i -e '/## Inhoudsopgave/,/^---$/d' docs/ios/README.md
          sed -i -e '/## ❤️ Support/,$d' docs/ios/README.md
      - run: pip install mkdocs-material mkdocs-static-i18n
      - run: mkdocs gh-deploy --force
