site_name: CIMDriver
site_description: De moderne en slimme ritten- en werkurenregistratie app voor Android en iOS
site_author: Remco Visser
repo_url: https://github.com/Vircos01/CIMDriver
site_url: https://vircos01.github.io/CIMDriver/
copyright: Copyright &copy; 2026 CIMDriver


extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Vircos01/CIMDriver
      name: Bekijk CIMDriver op GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:support@cimdriver.com
      name: Neem contact op met support

theme:
  name: material
  custom_dir: docs/overrides
  language: nl
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css?v=4

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables

